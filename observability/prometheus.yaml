global:
  scrape_interval: 30s
  evaluation_interval: 30s
storage:
  tsdb:
    # S3 daily metrics and BigQuery measurements arrive after their observation time.
    out_of_order_time_window: 3d
scrape_configs:
  - job_name: otel-collector
    honor_timestamps: true
    static_configs:
      - targets: ['otel-collector:9464']
